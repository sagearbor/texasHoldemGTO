name: felt_notes
description: "Felt Notes: GTO poker trainer and home-game stats."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Local trainer history / leak tracking. 2.2.x supports Flutter 3.22.
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
