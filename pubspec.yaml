name: felt_notes
description: "Felt Notes: GTO poker trainer and home-game stats."
publish_to: 'none'
version: 0.3.1+10

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # Local trainer history / leak tracking. 2.2.x supports Flutter 3.22.
  shared_preferences: ^2.2.3
  # Keeps the screen on while the blind clock is open. 1.3.x is the last line
  # that supports Flutter 3.22 / Dart 3.4 (1.5+ needs Flutter 3.38).
  wakelock_plus: ">=1.3.0 <1.4.0"
  # On-device card reading (Snap my cards). 0.15.1+ / 1.2.0+ need newer Flutter.
  google_mlkit_text_recognition: 0.15.0
  image_picker: ">=1.1.2 <1.2.0"
  # About screen version. 9.x needs a newer Flutter Gradle plugin (compileSdk
  # = flutter.compileSdkVersion fails on 3.22); 8.3.1 is the last 8.x and builds.
  package_info_plus: ">=8.3.1 <9.0.0"
  # Share the report-card PNG. 10.1.x is the last line built for Flutter 3.22 / Dart 3.4.
  share_plus: ">=10.1.4 <10.2.0"
  # Board caller: push-to-talk, on-device speech recognition (OS engine, free).
  # 7.2+ uses compileSdk = flutter.compileSdkVersion (fails on Flutter 3.22),
  # 7.5+ needs Flutter 3.44 / Dart 3.12. 7.1.0 builds.
  speech_to_text: ">=7.1.0 <7.2.0"
  # Restore from a backup file. 8.3.2 declares Flutter >=3.22 / Dart >=3.4
  # (compileSdk 34, AGP 7.4) and builds; 8.3.3+ was not verified on 3.22.
  file_picker: ">=8.3.2 <8.3.3"
  # Watch my cards: live low-res frame stream. 0.11.0+2 is the last release
  # for Flutter < 3.27 (0.11.1 needs Dart 3.6); it has MediaSettings(fps).
  camera: 0.11.0+2
  # Android side of camera. 0.6.8+2 uses SurfaceProducer.Callback (Flutter
  # 3.24 embedding) and fails to compile on 3.22; 0.6.7+2 builds.
  camera_android_camerax: 0.6.7+2
  # Watch my cards: speaks the cards it read (OS speech engine, offline,
  # free, follows the audio route to Bluetooth earbuds). 4.2.x: Dart >= 3.4.
  flutter_tts: ">=4.2.0 <4.3.0"
  # Watch my cards diagnostics: battery level every 10 minutes. 6.2.x
  # declares Flutter >=3.22 / Dart >=3.4.
  battery_plus: ">=6.2.1 <6.2.2"
  # Watch my cards "Buzz my watch": a local notification the phone mirrors
  # to a paired smartwatch. 17.2.x builds on Flutter 3.22 (apk + ios); it
  # needs core library desugaring (android/app/build.gradle).
  flutter_local_notifications: ">=17.2.3 <17.3.0"
  # Watch my cards diagnostics file (already a transitive dependency).
  path_provider: ">=2.1.0 <2.2.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - data/solved/preflop.json
